name: Deploy ForzaDJ

on:
  push:
    branches:
      - main

# Деплой не параллелится: два одновременных пуша (например, обычный push и
# фикс от бота) раньше запускали два деплоя разом на один и тот же VPS —
# оба одновременно делали git reset / rm .next / pm2 stop/start, и сервер
# оставался в непредсказуемом полусобранном состоянии. Теперь второй запуск
# просто дожидается очереди вместо гонки с первым.
concurrency:
  group: deploy-forzadj
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 25m
          script: |
            cd ${{ secrets.PROJECT_PATH }}

            git fetch --prune origin

            if [ -n "$(git status --porcelain --untracked-files=all)" ]; then
              BACKUP_DIR="/tmp/forzadj-backup-$(date +%Y%m%d-%H%M%S)"
              mkdir -p "$BACKUP_DIR"
              tar -czf "$BACKUP_DIR/repo-backup.tgz" --exclude='.git' .
              echo "Backed up current repository state to $BACKUP_DIR/repo-backup.tgz"
            fi

            git checkout -B main origin/main
            git reset --hard origin/main
            git clean -fd

            npm install

            npx prisma generate
            npx prisma migrate deploy

            npm run build

            sudo pm2 restart forzadj
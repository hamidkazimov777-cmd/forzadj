name: Deploy ForzaDJ

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd ${{ secrets.PROJECT_PATH }}

            git fetch --prune origin

            if [ -n "$(git status --porcelain --untracked-files=all)" ]; then
              BACKUP_DIR="/tmp/forzadj-backup-$(date +%Y%m%d-%H%M%S)"
              mkdir -p "$BACKUP_DIR"
              tar -czf "$BACKUP_DIR/repo-backup.tgz" --exclude='.git' .
              echo "Backed up current repository state to $BACKUP_DIR/repo-backup.tgz"
            fi

            git checkout -B main origin/main
            git reset --hard origin/main
            git clean -fd

            npm install

            npx prisma generate
            npx prisma migrate deploy

            npm run build

            pm2 restart forzadj
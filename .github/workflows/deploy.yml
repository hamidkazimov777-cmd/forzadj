name: Deploy ForzaDJ

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd ${{ secrets.PROJECT_PATH }}

            git fetch origin
            git reset --hard origin/main

            npm install

            npx prisma generate
            npx prisma migrate deploy

            npm run build

            pm2 restart forzadj